<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jukebox">
  <title>Eden's Jukebox</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --bg: #0a0a0f;
      --surface: #16161e;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.5);
      --accent: #1ed760;
      --glow: rgba(30,215,96,0.35);
      --bar-height: 64px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #song-grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--bar-height);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      align-content: start;
      background: var(--bg);
    }

    @media (min-width: 500px) {
      #song-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 700px) {
      #song-grid { grid-template-columns: repeat(4, 1fr); padding: 1rem; gap: 0.75rem; }
    }

    .song-btn {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      background: var(--surface);
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
      width: 100%;
      display: block;
    }

    .song-btn:active { transform: scale(0.93); }

    .song-btn.playing {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow), 0 8px 24px rgba(0,0,0,0.6);
    }

    .song-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .song-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.4rem 0.5rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      pointer-events: none;
    }

    .song-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playing-indicator {
      position: absolute;
      top: 0.4rem; right: 0.4rem;
      display: none;
      gap: 2px;
      align-items: flex-end;
      height: 16px;
    }

    .song-btn.playing .playing-indicator { display: flex; }

    .playing-indicator span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: bounce 0.8s ease-in-out infinite;
    }

    .playing-indicator span:nth-child(1) { height: 7px;  animation-delay: 0s;    }
    .playing-indicator span:nth-child(2) { height: 13px; animation-delay: 0.15s; }
    .playing-indicator span:nth-child(3) { height: 9px;  animation-delay: 0.3s;  }
    .playing-indicator span:nth-child(4) { height: 15px; animation-delay: 0.1s;  }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
      50%       { transform: scaleY(1);   opacity: 1;   }
    }

    .now-playing-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bar-height);
      padding: 0 1rem;
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(22,22,30,0.97);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 10;
    }

    .np-art {
      width: 38px; height: 38px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface);
      display: none;
    }

    .np-info { flex: 1; min-width: 0; }

    .np-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-idle { font-size: 0.85rem; color: var(--text-dim); }

    .volume-wrap { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

    .vol-icon { font-size: 1rem; cursor: pointer; color: var(--text-dim); }

    input[type=range] {
      -webkit-appearance: none;
      width: 70px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    #status-msg {
      display: none;
      position: fixed;
      top: 1rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      text-align: center;
      max-width: 80vw;
    }
  </style>
</head>
<body>

<div id="song-grid"></div>

<div class="now-playing-bar">
  <img class="np-art" id="np-art" src="" alt="">
  <div class="np-info">
    <div class="np-idle" id="np-idle">Tap a song to play</div>
    <div class="np-title" id="np-title" style="display:none"></div>
  </div>
  <div class="volume-wrap">
    <span class="vol-icon" id="vol-icon">🔊</span>
    <input type="range" id="volume" min="0" max="100" value="80">
  </div>
</div>

<div id="status-msg"></div>

<script>
let SONGS = [];
const audio = new Audio();
audio.loop = true;
let currentIndex = null;

function playSong(index) {
  if (currentIndex === index) {
    if (audio.paused) { audio.play(); highlight(index); }
    else { audio.pause(); highlight(null); }
    return;
  }
  audio.pause();
  audio.src = SONGS[index].file;
  audio.load();
  audio.play().catch(e => console.warn(e));
  currentIndex = index;
  highlight(index);
  setNowPlaying(SONGS[index]);
}

function highlight(index) {
  document.querySelectorAll('.song-btn').forEach((btn, i) => {
    btn.classList.toggle('playing', i === index);
  });
}

audio.addEventListener('error', () => showStatus('Could not load audio file.'));

function buildGrid() {
  const grid = document.getElementById('song-grid');
  grid.innerHTML = '';
  SONGS.forEach((song, index) => {
    const btn = document.createElement('button');
    btn.className = 'song-btn';
    btn.innerHTML =
      '<div style="position:absolute;top:0;left:0;right:0;bottom:0;"><img src="' + song.art + '" alt="' + song.name + '" loading="lazy" onerror="this.style.display=\'none\'" style="width:100%;height:100%;object-fit:cover;display:block;"></div>' +
      '<div class="playing-indicator"><span></span><span></span><span></span><span></span></div>' +
      '<div class="song-overlay"><div class="song-title">' + song.name + '</div></div>';
    btn.addEventListener('click', () => playSong(index));
    grid.appendChild(btn);
  });
}

function setNowPlaying(song) {
  document.getElementById('np-idle').style.display = 'none';
  const t = document.getElementById('np-title');
  t.textContent = song.name;
  t.style.display = 'block';
  const art = document.getElementById('np-art');
  art.src = song.art;
  art.style.display = 'block';
}

const volSlider = document.getElementById('volume');
const volIcon = document.getElementById('vol-icon');
volSlider.addEventListener('input', () => {
  audio.volume = volSlider.value / 100;
  volIcon.textContent = volSlider.value == 0 ? '🔇' : volSlider.value < 50 ? '🔉' : '🔊';
});
volIcon.addEventListener('click', () => {
  volSlider.value = volSlider.value > 0 ? 0 : 80;
  volSlider.dispatchEvent(new Event('input'));
});

function showStatus(msg) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

fetch('songs.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => { SONGS = data; buildGrid(); })
  .catch(() => showStatus('Could not load songs.json'));
</script>
</body>
</html>
