<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jukebox">
  <title>Eden's Jukebox</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0a0f;
      --surface: #16161e;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.5);
      --accent: #1ed760;
      --glow: rgba(30,215,96,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* LOGIN SCREEN */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 4rem;
    }

    .login-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .login-sub {
      font-size: 1rem;
      color: var(--text-dim);
      margin-top: -1rem;
    }

    .spotify-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      text-decoration: none;
    }

    .spotify-btn:active { transform: scale(0.96); opacity: 0.9; }

    .spotify-logo { width: 24px; height: 24px; }

    /* JUKEBOX SCREEN */
    #jukebox-screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      align-content: start;
    }

    @media (min-width: 500px) {
      .grid-container { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 700px) {
      .grid-container {
        grid-template-columns: repeat(4, 1fr);
        padding: 2rem;
        gap: 1.25rem;
      }
    }

    .song-btn {
      position: relative;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      background: var(--surface);
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    .song-btn:active { transform: scale(0.93); }

    .song-btn.playing {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow), 0 8px 32px rgba(0,0,0,0.6);
    }

    .song-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .song-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.6rem 0.7rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      pointer-events: none;
    }

    .song-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .playing-indicator {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: none;
      gap: 2px;
      align-items: flex-end;
      height: 18px;
    }

    .song-btn.playing .playing-indicator { display: flex; }

    .playing-indicator span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: bounce 0.8s ease-in-out infinite;
    }

    .playing-indicator span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .playing-indicator span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .playing-indicator span:nth-child(3) { height: 10px; animation-delay: 0.3s; }
    .playing-indicator span:nth-child(4) { height: 16px; animation-delay: 0.1s; }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* BOTTOM BAR */
    .now-playing-bar {
      padding: 0.75rem 1.25rem;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      background: rgba(22,22,30,0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 60px;
    }

    .np-art {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface);
    }

    .np-info { flex: 1; min-width: 0; }

    .np-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-artist {
      font-size: 0.72rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-idle {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .vol-icon { font-size: 1rem; cursor: pointer; color: var(--text-dim); }

    input[type=range] {
      -webkit-appearance: none;
      width: 70px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    /* LOADING / ERROR */
    #loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      color: var(--text-dim);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      font-size: 0.9rem;
      color: #ff6b6b;
      text-align: center;
      padding: 0 2rem;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="logo">🎵</div>
    <div>
      <div class="login-title">Eden's Jukebox</div>
      <div class="login-sub">Tap a song to play</div>
    </div>
    <a id="login-btn" class="spotify-btn" href="#">
      <svg class="spotify-logo" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
      Connect with Spotify
    </a>
    <div id="login-error" class="error-msg" style="display:none"></div>
  </div>

  <!-- LOADING -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div>Setting up your jukebox…</div>
  </div>

  <!-- JUKEBOX -->
  <div id="jukebox-screen">
    <div class="grid-container" id="song-grid"></div>
    <div class="now-playing-bar">
      <img class="np-art" id="np-art" src="" alt="" style="display:none">
      <div class="np-info">
        <div class="np-idle" id="np-idle">Tap a song to play</div>
        <div style="display:none" id="np-track">
          <div class="np-title" id="np-title"></div>
          <div class="np-artist" id="np-artist"></div>
        </div>
      </div>
      <div class="volume-wrap">
        <span class="vol-icon" id="vol-icon">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="80">
      </div>
    </div>
  </div>

</div>
<script>
const CLIENT_ID = '4b2c34ab38354c1ba6fb8f1d95d57444';
const REDIRECT_URI = 'https://gforce1988-dotcom.github.io/edens-jukebox/';
const SCOPES = 'user-read-email user-read-private user-modify-playback-state user-read-playback-state';

const SONGS = [
  { name: 'Hoist the Colours', artist: 'Hans Zimmer', trackId: '5i2kmT9FLpTU0D80rjcee5', art: '' },
  { name: 'Wellerman', artist: 'Nathan Evans', trackId: '2374M0fQpWi3dLnB54qaLX', art: '' },
  { name: 'Day-O (Banana Boat Song)', artist: 'Harry Belafonte', trackId: '4fHDlIntTsRGSyTg5UYZYC', art: '' },
  { name: 'Wheels on the Bus', artist: 'CoComelon', trackId: '2TQOTKBoA5pX25hwKXMU2J', art: '' }
];

// AUTH (PKCE)
function getToken() { return localStorage.getItem('sp_token'); }
function setToken(t) { localStorage.setItem('sp_token', t); }
function clearToken() { localStorage.removeItem('sp_token'); localStorage.removeItem('sp_verifier'); }

function generateRandom(len) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function generateChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function startLogin() {
  const verifier = generateRandom(64);
  const challenge = await generateChallenge(verifier);
  localStorage.setItem('sp_verifier', verifier);
  const params = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location = 'https://accounts.spotify.com/authorize?' + params;
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem('sp_verifier');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (data.access_token) {
    setToken(data.access_token);
    if (data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
    return data.access_token;
  }
  return null;
}

async function refreshToken() {
  const refresh = localStorage.getItem('sp_refresh');
  if (!refresh) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: refresh,
      client_id: CLIENT_ID
    })
  });
  const data = await res.json();
  if (data.access_token) { setToken(data.access_token); return data.access_token; }
  return null;
}

// SCREENS
const screens = {
  login: document.getElementById('login-screen'),
  loading: document.getElementById('loading-screen'),
  jukebox: document.getElementById('jukebox-screen')
};

function show(name) {
  Object.entries(screens).forEach(([k, el]) => {
    el.style.display = k === name ? 'flex' : 'none';
  });
}

// SPOTIFY CONNECT
let currentTrackId = null;
let activeDeviceId = null;

async function apiCall(endpoint, method, body, token) {
  const res = await fetch('https://api.spotify.com/v1' + endpoint, {
    method: method || 'GET',
    headers: {
      Authorization: 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) {
    const newToken = await refreshToken();
    if (newToken) return apiCall(endpoint, method, body, newToken);
    clearToken(); show('login'); return null;
  }
  if (res.status === 204 || res.status === 202) return true;
  if (res.ok) { try { return await res.json(); } catch(e) { return true; } }
  return null;
}

async function getActiveDevice(token) {
  const data = await apiCall('/me/player/devices', 'GET', null, token);
  if (!data) { showStatus('API error - try logging out and back in.'); return null; }
  if (!data.devices) { showStatus('No devices field in response.'); return null; }
  showStatus('Devices found: ' + data.devices.length + (data.devices.length ? ' - ' + data.devices.map(d=>d.name+'('+(d.is_active?'active':'inactive')+')').join(', ') : ''));
  const active = data.devices.find(d => d.is_active);
  if (active) return active.id;
  if (data.devices.length > 0) return data.devices[0].id;
  return null;
}

async function playSong(trackId, token) {
  currentTrackId = trackId;
  document.querySelectorAll('.song-btn').forEach(b => {
    b.classList.toggle('playing', b.dataset.id === trackId);
  });

  // Get active device
  let deviceId = await getActiveDevice(token);

  if (!deviceId) {
    showStatus('Open Spotify on your phone first, then tap again.');
    return;
  }

  // Play the track with repeat on
  await apiCall('/me/player/play?device_id=' + deviceId, 'PUT', {
    uris: ['spotify:track:' + trackId]
  }, token);

  // Set repeat to track (loops single song)
  setTimeout(() => {
    apiCall('/me/player/repeat?state=track&device_id=' + deviceId, 'PUT', null, token);
  }, 500);
}

function showStatus(msg) {
  let el = document.getElementById('status-msg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'status-msg';
    el.style.cssText = 'position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:0.6rem 1.2rem;border-radius:20px;font-size:0.85rem;z-index:999;text-align:center;max-width:80vw';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ARTWORK
async function loadArtwork(token) {
  const ids = SONGS.map(s => s.trackId).join(',');
  try {
    const data = await apiCall('/tracks?ids=' + ids, 'GET', null, token);
    if (data && data.tracks) {
      data.tracks.forEach((track, i) => {
        if (track && track.album && track.album.images[0]) {
          SONGS[i].art = track.album.images[0].url;
        }
      });
    }
  } catch(e) { console.warn('Artwork failed', e); }
}

// GRID
function buildGrid() {
  const grid = document.getElementById('song-grid');
  grid.innerHTML = '';
  SONGS.forEach(song => {
    const btn = document.createElement('button');
    btn.className = 'song-btn';
    btn.dataset.id = song.trackId;
    btn.innerHTML =
      (song.art ? '<img src="' + song.art + '" alt="' + song.name + '" loading="lazy">' : '') +
      '<div class="playing-indicator" aria-hidden="true"><span></span><span></span><span></span><span></span></div>' +
      '<div class="song-overlay"><div class="song-title">' + song.name + '</div><div class="song-artist">' + song.artist + '</div></div>';
    btn.addEventListener('click', () => handleTap(song));
    grid.appendChild(btn);
  });
}

function setNowPlaying(song) {
  document.getElementById('np-idle').style.display = 'none';
  document.getElementById('np-track').style.display = 'block';
  document.getElementById('np-title').textContent = song.name;
  document.getElementById('np-artist').textContent = song.artist;
  const art = document.getElementById('np-art');
  if (song.art) { art.src = song.art; art.style.display = 'block'; }
  else { art.style.display = 'none'; }
}

async function handleTap(song) {
  const token = getToken();
  if (!token) { show('login'); return; }
  await playSong(song.trackId, token);
  setNowPlaying(song);
}

// VOLUME
const volSlider = document.getElementById('volume');
const volIcon = document.getElementById('vol-icon');
volSlider.addEventListener('input', async () => {
  const v = parseInt(volSlider.value);
  volIcon.textContent = v === 0 ? '🔇' : v < 50 ? '🔉' : '🔊';
  const token = getToken();
  if (token) apiCall('/me/player/volume?volume_percent=' + v, 'PUT', null, token);
});
volIcon.addEventListener('click', () => {
  volSlider.value = volSlider.value > 0 ? 0 : 80;
  volSlider.dispatchEvent(new Event('input'));
});

// INIT
async function init(token) {
  show('loading');
  await loadArtwork(token);
  buildGrid();
  show('jukebox');
}

document.getElementById('login-btn').addEventListener('click', e => {
  e.preventDefault();
  startLogin();
});

const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

if (code) {
  window.history.replaceState(null, '', window.location.pathname);
  show('loading');
  exchangeCode(code).then(token => {
    if (token) init(token);
    else show('login');
  });
} else {
  const stored = getToken();
  if (stored) init(stored);
  else show('login');
}
</script>
</body>
</html>
